<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Flowers</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="flowers"></canvas>

<script>
const canvas = document.getElementById("flowers");
const ctx = canvas.getContext("2d");

const LAYERS = 85;
const POINTS = 460;

let width, height, unit;
let animation;
let startTime = null;

const flowers = [
  {
    x: -230,
    y: 40,
    scale: 0.77,
    tilt: -0.15,
    delay: 550
  },
  {
    x: 230,
    y: 40,
    scale: 0.77,
    tilt: 0.15,
    delay: 1100
  },
  {
    x: 0,
    y: -15,
    scale: 1,
    tilt: 0,
    delay: 0
  }
];

function clamp(value) {
  return Math.max(0, Math.min(1, value));
}

function traceCurve(p0, p1, p2, p3, progress, color, lineWidth) {
  if (progress <= 0) return;

  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";

  const steps = Math.max(1, Math.ceil(100 * progress));

  for (let i = 0; i <= steps; i++) {
    const t = progress * i / steps;
    const q = 1 - t;

    const x =
      q * q * q * p0[0] +
      3 * q * q * t * p1[0] +
      3 * q * t * t * p2[0] +
      t * t * t * p3[0];

    const y =
      q * q * q * p0[1] +
      3 * q * q * t * p1[1] +
      3 * q * t * t * p2[1] +
      t * t * t * p3[1];

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

function drawLeaf(x, y, direction, progress) {
  if (progress <= 0) return;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(direction * progress, progress);

  for (let i = 0; i < 16; i++) {
    const spread = i / 15;

    ctx.beginPath();
    ctx.strokeStyle =
      `hsla(145, 65%, ${30 + spread * 25}%, 0.8)`;
    ctx.lineWidth = 0.8;

    ctx.moveTo(0, 0);

    ctx.bezierCurveTo(
      30, -48 * spread,
      86, -68 * spread,
      112, -69
    );

    ctx.bezierCurveTo(
      88, -12 * spread,
      30, 15 * spread,
      0, 0
    );

    ctx.stroke();
  }

  ctx.beginPath();
  ctx.strokeStyle = "#75dd98";
  ctx.lineWidth = 1.1;
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(55, -27, 112, -69);
  ctx.stroke();

  ctx.restore();
}

function drawPetals(layer, progress) {
  if (progress <= 0) return;

  const size = 10 + layer * 2.28;
  const rotation = layer * 0.018;
  const lightness = 72 - layer * 0.24;

  ctx.strokeStyle = `hsl(330, 94%, ${lightness}%)`;
  ctx.lineWidth = 0.95;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.beginPath();

  const steps = Math.floor(POINTS * progress);

  for (let step = 0; step <= steps; step++) {
    const angle = Math.PI * 2 * step / POINTS;

    const radius =
      size * (0.64 + 0.36 * Math.cos(7 * angle));

    const x = radius * Math.cos(angle + rotation);
    const y = radius * Math.sin(angle + rotation);

    if (step === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

function drawFlower(flower, elapsed) {
  const time = elapsed - flower.delay;
  if (time < 0) return;

  ctx.save();
  ctx.translate(flower.x, flower.y);
  ctx.rotate(flower.tilt);
  ctx.scale(flower.scale, flower.scale);

  const flowerY = -110;

  ctx.shadowColor = "#31965a";
  ctx.shadowBlur = 5;

  traceCurve(
    [0, 290],
    [31, 180],
    [-25, 65],
    [0, flowerY],
    clamp(time / 1700),
    "#49ad73",
    2.4
  );

  ctx.shadowBlur = 0;

  drawLeaf(
    9, 182, 1,
    clamp((time - 800) / 1000)
  );

  drawLeaf(
    -1, 107, -1,
    clamp((time - 1200) / 1000)
  );

  ctx.translate(0, flowerY);

  const progress =
    clamp((time - 1600) / 6500) * LAYERS;

  const completed = Math.floor(progress);

  ctx.shadowColor = "#ff328f";
  ctx.shadowBlur = 3;

  for (let layer = 0; layer < completed; layer++) {
    drawPetals(layer, 1);
  }

  if (completed < LAYERS) {
    drawPetals(completed, progress - completed);
  }

  ctx.restore();
}

function render(time) {
  if (startTime === null) startTime = time;

  const elapsed = time - startTime;

  ctx.clearRect(0, 0, width, height);

  ctx.save();
  ctx.translate(width / 2, height / 2);
  ctx.scale(unit, unit);

  for (const flower of flowers) {
    drawFlower(flower, elapsed);
  }

  ctx.restore();

  if (elapsed < 9500) {
    animation = requestAnimationFrame(render);
  }
}

function resize() {
  cancelAnimationFrame(animation);

  width = window.innerWidth;
  height = window.innerHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // مساحة كافية لظهور الوردات الثلاث بالكامل.
  unit = Math.min(width / 880, height / 720);

  startTime = null;
  animation = requestAnimationFrame(render);
}

window.addEventListener("resize", resize);
resize();
</script>
</body>
</html>
