<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Flower</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="flower"></canvas>

<script>
const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

let width, height, unit, startTime;
let animation;

const layers = 85;
const points = 500;

function traceCurve(p0, p1, p2, p3, progress, color, lineWidth) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";

  const steps = Math.max(1, Math.ceil(100 * progress));

  for (let i = 0; i <= steps; i++) {
    const t = progress * i / steps;
    const q = 1 - t;

    const x =
      q*q*q*p0[0] +
      3*q*q*t*p1[0] +
      3*q*t*t*p2[0] +
      t*t*t*p3[0];

    const y =
      q*q*q*p0[1] +
      3*q*q*t*p1[1] +
      3*q*t*t*p2[1] +
      t*t*t*p3[1];

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

function leaf(x, y, direction, progress) {
  if (progress <= 0) return;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(direction * progress, progress);

  // خطوط متداخلة داخل كل ورقة.
  for (let i = 0; i < 16; i++) {
    const spread = i / 15;

    ctx.beginPath();
    ctx.strokeStyle = `hsla(145, 65%, ${30 + spread * 25}%, 0.8)`;
    ctx.lineWidth = 0.8;

    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(
      30, -48 * spread,
      86, -68 * spread,
      112, -69
    );
    ctx.bezierCurveTo(
      88, -12 * spread,
      30, 15 * spread,
      0, 0
    );
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.strokeStyle = "#75dd98";
  ctx.lineWidth = 1.1;
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(55, -27, 112, -69);
  ctx.stroke();

  ctx.restore();
}

function flowerLayer(layer, progress) {
  const size = 10 + layer * 2.28;
  const rotation = layer * 0.018;

  // تدرجات بينك فقط.
  const lightness = 72 - layer * 0.24;
  ctx.strokeStyle = `hsl(330, 94%, ${lightness}%)`;
  ctx.lineWidth = 0.95;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.beginPath();

  const steps = Math.floor(points * progress);

  for (let step = 0; step <= steps; step++) {
    const angle = Math.PI * 2 * step / points;
    const radius = size * (0.64 + 0.36 * Math.cos(7 * angle));
    const x = radius * Math.cos(angle + rotation);
    const y = radius * Math.sin(angle + rotation);

    if (step === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

function clamp(value) {
  return Math.max(0, Math.min(1, value));
}

function render(time) {
  if (startTime === null) startTime = time;
  const elapsed = time - startTime;

  ctx.clearRect(0, 0, width, height);
  ctx.save();

  ctx.translate(width / 2, height / 2);
  ctx.scale(unit, unit);

  // إحداثيات التصميم تضمن ظهور الوردة بالكامل.
  const flowerY = -110;

  const stemProgress = clamp(elapsed / 1700);

  ctx.shadowColor = "#31965a";
  ctx.shadowBlur = 5;

  traceCurve(
    [0, 290],
    [31, 180],
    [-25, 65],
    [0, flowerY],
    stemProgress,
    "#49ad73",
    2.4
  );

  ctx.shadowBlur = 0;

  leaf(9, 182, 1, clamp((elapsed - 800) / 1000));
  leaf(-1, 107, -1, clamp((elapsed - 1200) / 1000));

  ctx.translate(0, flowerY);

  const flowerProgress = clamp((elapsed - 1600) / 6500) * layers;
  const completed = Math.floor(flowerProgress);

  ctx.shadowColor = "#ff328f";
  ctx.shadowBlur = 3;

  for (let layer = 0; layer < completed; layer++) {
    flowerLayer(layer, 1);
  }

  if (completed < layers) {
    flowerLayer(completed, flowerProgress - completed);
  }

  ctx.restore();

  if (elapsed < 8200) {
    animation = requestAnimationFrame(render);
  }
}

function resize() {
  cancelAnimationFrame(animation);

  width = window.innerWidth;
  height = window.innerHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  unit = Math.min(width / 470, height / 690);
  startTime = null;

  animation = requestAnimationFrame(render);
}

window.addEventListener("resize", resize);
resize();
</script>
</body>
</html>
